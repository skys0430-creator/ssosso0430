<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
body{width:1300px;padding:6px 0 10px 2px;word-break:keep-all}
.t1{display:flex;align-items:baseline;gap:6px;font-family:'Gothic A1',sans-serif;color:#0B1220;letter-spacing:-1.5px;line-height:1}
.yr{font-weight:900;font-size:86px;letter-spacing:-3px;background:linear-gradient(100deg,#1E3A8A 0%,#2563EB 60%,#38BDF8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.t1 .rest{font-weight:800;font-size:64px}
.t1 .rest .y{font-weight:700;font-size:48px;color:#1E3A8A;margin-right:10px;letter-spacing:-1px}
.t2{display:flex;align-items:center;gap:16px;margin-top:22px;font-family:'Gowun Batang',serif;font-weight:700;font-size:40px;color:#334155;letter-spacing:-0.5px;line-height:1.1}
.ico{width:46px;height:46px;flex:0 0 46px}
.hl{position:relative;color:#1D4ED8;padding:0 4px}
.hl:before{content:"";position:absolute;left:-2px;right:-2px;bottom:2px;height:16px;background:#BFDBFE;border-radius:8px;z-index:-1;transform:rotate(-1deg)}
.dot{color:#94A3B8;margin:0 2px}
.vi{color:#0B1220}
</style></head><body>
<div class="t1"><span class="yr">2027</span><span class="rest"><span class="y">년도</span>통합지원 지역계획</span></div>
<div class="t2">
  <svg class="ico" viewBox="0 0 48 48" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 22 24 7l18 15"/><path d="M11 18v22h26V18"/>
    <path d="M24 34s-7-4.3-7-9a3.8 3.8 0 0 1 7-2.2A3.8 3.8 0 0 1 31 25c0 4.7-7 9-7 9z" fill="#BFDBFE"/>
  </svg>
  <span>살던 곳에서 <span class="hl">건강하게</span><span class="dot">,</span> 함께 살피는 <span class="vi">의왕</span></span>
</div>
</body></html>
