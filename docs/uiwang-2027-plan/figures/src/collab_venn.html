<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{word-break:keep-all;font-family:'Pretendard',sans-serif;color:#1d2b3a;background:#fff;width:1000px;height:640px;position:relative}
.circ{position:absolute;border-radius:50%;width:560px;height:560px;top:50px}
.c1{left:40px;background:rgba(36,80,125,.13);border:3px solid #24507d}
.c2{left:400px;background:rgba(58,143,183,.14);border:3px solid #3a8fb7}
.ttl{position:absolute;top:8px;font-size:21px;font-weight:800;color:#fff;padding:6px 18px;border-radius:22px}
.t1{left:130px;background:#24507d}
.t2{right:110px;background:#3a8fb7}
.org{position:absolute;background:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 2px 6px rgba(27,58,92,.12);border-left:6px solid var(--c);width:265px}
.org b{display:block;font-size:19px;font-weight:800;color:#1d2b3a}
.org small{display:block;font-size:13.5px;color:#6b7f95;margin-top:1px}
.chips{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.chips span{font-size:13.5px;font-weight:700;color:#fff;background:var(--c);border-radius:12px;padding:2px 10px}
.mid{position:absolute;left:390px;top:255px;width:220px;text-align:center;background:#fff;border-radius:16px;padding:12px 10px;box-shadow:0 2px 8px rgba(27,58,92,.18);border:2.5px solid #e58a1f}
.mid b{display:block;font-size:19px;font-weight:800}
.mid small{display:block;font-size:13.5px;color:#6b7f95}
.mid .chips{justify-content:center}
.mid .chips span{background:#e58a1f}
.city{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;background:#e58a1f;color:#fff;font-size:18px;font-weight:800;padding:8px 26px;border-radius:24px;white-space:nowrap}
</style></head><body>
<div class="circ c1"></div><div class="circ c2"></div>
<div class="ttl t1">대상자 발굴·조사·계획</div>
<div class="ttl t2">역량 강화·기술 지원</div>

<div class="org" style="--c:#1b3a5c;left:115px;top:150px"><b>국민건강보험공단</b><small>의왕지사 돌봄통합TF팀 · 노인</small><div class="chips"><span>빅데이터 발굴</span><span>판정조사</span><span>지원계획 협의</span></div></div>
<div class="org" style="--c:#24507d;left:115px;top:370px"><b>국민연금공단</b><small>군포의왕지사 장애인지원센터 · 장애인</small><div class="chips"><span>판정조사·회신</span><span>서비스 연계 협의</span></div></div>

<div class="mid"><b>한국장애인개발원</b><small>통합돌봄지원팀</small><div class="chips"><span>복합사례 자문</span><span>교육</span><span>자료 공유</span></div></div>

<div class="org" style="--c:#3a8fb7;left:620px;top:150px"><b>경기복지재단</b><small>돌봄통합지원단</small><div class="chips"><span>시군 맞춤형 교육</span><span>컨설팅</span></div></div>
<div class="org" style="--c:#3a8fb7;left:620px;top:370px"><b>한국보건복지인재원</b><small>직급·역할별 교육</small><div class="chips"><span>기본·심화·리더</span><span>지역계획 교육</span></div></div>

<div class="city">의왕시 통합돌봄 전담조직 · 동 전담인력</div>
</body></html>
